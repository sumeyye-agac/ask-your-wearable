[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable"
version = "0.1.0"
description = "Deterministic, tested analysis tools for daily wearable data."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
# Only scripts/ask.py needs these; the tool package itself does not call any API.
agent = ["anthropic>=2.8", "python-dotenv>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
